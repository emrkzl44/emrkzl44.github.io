remote_theme: mmistakes/minimal-mistakes
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

minimal_mistakes_skin: "dark"

title: "Emre Kuzal"
description: "Computer Engineering student"
url: "https://emrkzl44.github.io"

author:
  name: "Emre Kuzal"
  avatar: "/assets/images/computer.svg"
  bio: "Computer Engineering student"
  location: "Mersin, Türkiye"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/emrkzl44"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/emre-kuzal-73b90932b"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:emre33kuzal@gmail.com"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide
      header:
        overlay_color: "#070b1a"
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      classes: wide
      show_date: true
      header:
        overlay_color: "#070b1a"
        show_overlay_excerpt: false
