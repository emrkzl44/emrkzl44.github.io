<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b3d"/>
      <stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="37" y="27" width="166" height="106" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .halo { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .pc { animation: float 5s ease-in-out infinite; }
    .code { transform-box: fill-box; transform-origin: left center; animation: type 6s ease-in-out infinite; }
    .c2 { animation-delay: 0.35s; }
    .c3 { animation-delay: 0.7s; }
    .c4 { animation-delay: 1.05s; }
    .c5 { animation-delay: 1.4s; }
    .cursor { animation: blink 1s step-end infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }
    .led { animation: blink 2s ease-in-out infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; }
    .s3 { animation-delay: 2s; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes type { 0% { transform: scaleX(0); } 25%, 80% { transform: scaleX(1); } 95%, 100% { transform: scaleX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes shine { 0%, 50% { transform: translateX(0); } 100% { transform: translateX(330px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: translateY(0) scale(0.8); } 50% { opacity: 1; transform: translateY(-8px) scale(1.2); } }
  </style>

  <ellipse class="halo" cx="120" cy="88" rx="115" ry="85" fill="url(#halo)"/>

  <g class="pc">
    <rect x="30" y="20" width="180" height="120" rx="12" fill="url(#frame)"/>
    <rect x="37" y="27" width="166" height="106" rx="7" fill="url(#screen)"/>

    <circle cx="48" cy="38" r="3" fill="#f472b6"/>
    <circle cx="58" cy="38" r="3" fill="#fbbf24"/>
    <circle cx="68" cy="38" r="3" fill="#34d399"/>

    <rect class="code c1" x="48" y="52" width="70" height="6" rx="3" fill="#a78bfa"/>
    <rect class="code c2" x="58" y="65" width="96" height="6" rx="3" fill="#67e8f9"/>
    <rect class="code c3" x="58" y="78" width="60" height="6" rx="3" fill="#f0abfc"/>
    <rect class="code c4" x="68" y="91" width="80" height="6" rx="3" fill="#67e8f9"/>
    <rect class="code c5" x="48" y="104" width="44" height="6" rx="3" fill="#a78bfa"/>
    <rect class="cursor" x="98" y="102" width="3" height="10" rx="1" fill="#ffffff"/>

    <g clip-path="url(#screenClip)">
      <g transform="skewX(-20)">
        <rect class="shine" x="-40" y="20" width="26" height="130" fill="#ffffff" opacity="0.08"/>
      </g>
    </g>

    <circle class="led" cx="120" cy="136.5" r="1.8" fill="#ffffff"/>

    <path d="M106 140 H134 L140 164 H100 Z" fill="url(#frame)" opacity="0.8"/>
    <rect x="80" y="163" width="80" height="8" rx="4" fill="url(#frame)"/>
  </g>

  <circle class="spark s1" cx="20" cy="45" r="3" fill="#67e8f9"/>
  <circle class="spark s2" cx="222" cy="58" r="2.5" fill="#a78bfa"/>
  <circle class="spark s3" cx="212" cy="150" r="2" fill="#f0abfc"/>
</svg>
