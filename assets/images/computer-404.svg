<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1">
        <animate attributeName="seed" values="1;5;9;14;20;27" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="37" y="27" width="166" height="106" rx="7"/>
    </clipPath>
  </defs>

  <style>
    .halo { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .pc { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 3.2s ease-in-out infinite; }
    .static { animation: flicker 0.25s steps(2) infinite; }
    .t-c { animation: shiftC 1.4s steps(1) infinite; }
    .t-p { animation: shiftP 1.4s steps(1) infinite; }
    .t-w { animation: jolt 1.4s steps(1) infinite; }
    .bar { animation: barMove 1.8s linear infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 1.2s ease-out infinite; }
    .s2 { animation-delay: 0.4s; }
    .s3 { animation-delay: 0.8s; }
    .led { animation: ledBlink 0.5s steps(1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(-2deg) translateY(-3px); } 52% { transform: rotate(-6deg) translateX(2px); } 54% { transform: rotate(-3deg); } }
    @keyframes flicker { 0% { opacity: 0.22; } 50% { opacity: 0.38; } }
    @keyframes shiftC { 0% { transform: translate(-3px, 0); } 30% { transform: translate(-6px, 1px); } 32% { transform: translate(2px, -1px); } 60% { transform: translate(-2px, 0); } 85% { transform: translate(-8px, 2px); } }
    @keyframes shiftP { 0% { transform: translate(3px, 0); } 30% { transform: translate(6px, -1px); } 32% { transform: translate(-2px, 1px); } 60% { transform: translate(2px, 0); } 85% { transform: translate(8px, -2px); } }
    @keyframes jolt { 0% { transform: none; } 30% { transform: translateX(2px); } 32% { transform: none; } 85% { transform: translateX(-3px) skewX(-8deg); } 88% { transform: none; } }
    @keyframes barMove { from { transform: translateY(-20px); } to { transform: translateY(130px); } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 15% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: translate(10px, -22px) scale(0.3); } }
    @keyframes ledBlink { 50% { opacity: 0.15; } }
  </style>

  <ellipse class="halo" cx="120" cy="95" rx="115" ry="88" fill="url(#halo)"/>

  <g class="pc">
    <rect x="30" y="20" width="180" height="120" rx="12" fill="url(#frame)"/>
    <rect x="37" y="27" width="166" height="106" rx="7" fill="url(#screen)"/>

    <g clip-path="url(#screenClip)">
      <rect class="static" x="37" y="27" width="166" height="106" filter="url(#noise)"/>
      <rect class="bar" x="37" y="27" width="166" height="10" fill="#ffffff" opacity="0.07"/>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">
        <text class="t-c" x="120" y="96" fill="#22d3ee" opacity="0.8">404</text>
        <text class="t-p" x="120" y="96" fill="#f472b6" opacity="0.8">404</text>
        <text class="t-w" x="120" y="96" fill="#ffffff">404</text>
      </g>
      <text x="120" y="118" font-family="Consolas, monospace" font-size="9" fill="#f9a8d4" text-anchor="middle" letter-spacing="2">SYSTEM ERROR</text>

      <polyline points="150,27 160,52 152,60 170,84 162,95 176,133" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
      <polyline points="160,52 178,58 190,50" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
      <polyline points="170,84 188,92" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    </g>

    <circle class="led" cx="120" cy="136.5" r="1.8" fill="#f43f5e"/>

    <path d="M106 140 H134 L140 164 H100 Z" fill="url(#frame)" opacity="0.8"/>
    <rect x="80" y="163" width="80" height="8" rx="4" fill="url(#frame)" transform="rotate(4 120 167)"/>
  </g>

  <circle class="spark s1" cx="176" cy="34" r="2.5" fill="#fbbf24"/>
  <circle class="spark s2" cx="186" cy="40" r="2" fill="#f472b6"/>
  <circle class="spark s3" cx="170" cy="30" r="1.8" fill="#67e8f9"/>
  <circle class="spark s1" cx="48" cy="150" r="2" fill="#a78bfa"/>
</svg>
