{% if page.layout == "splash" %}
<div class="social-rail">
  {% for link in site.author.links %}
  <a href="{{ link.url }}" aria-label="{{ link.label }}" title="{{ link.label }}"{% unless link.url contains "mailto:" %} target="_blank" rel="noopener"{% endunless %}><i class="{{ link.icon }}"></i></a>
  {% endfor %}
  <span class="social-rail__line"></span>
</div>
{% endif %}
<div class="cursor-glow"></div>
<div class="vt-curtain" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<script>
(function () {
  var html = document.documentElement;
  var body = document.body;
  function mq(q) { return window.matchMedia ? window.matchMedia(q).matches : false; }
  var reduce = mq("(prefers-reduced-motion: reduce)");
  var fine = mq("(pointer: fine)");
  var supportsVT = "CSSViewTransitionRule" in window;
  var isHome = body.classList.contains("layout--splash");
  var is404 = body.classList.contains("page-404");

  /* Fixed elements live directly in <body> */
  [".social-rail", ".cursor-glow", ".vt-curtain", ".grain", ".cursor-dot", ".cursor-ring"].forEach(function (sel) {
    var el = document.querySelector(sel);
    if (el) body.appendChild(el);
  });

  /* ================= THEME (dark / light) ================= */
  var themeHooks = [];
  function getTheme() { return html.getAttribute("data-theme") === "light" ? "light" : "dark"; }
  function setTheme(t) {
    html.setAttribute("data-theme", t);
    try { localStorage.setItem("theme", t); } catch (e) {}
    themeHooks.forEach(function (fn) { fn(t); });
  }
  var mastWrap = document.querySelector(".masthead__inner-wrap");
  if (mastWrap) {
    var tbtn = document.createElement("button");
    tbtn.type = "button";
    tbtn.className = "theme-toggle";
    tbtn.setAttribute("aria-label", "Toggle dark / light theme");
    tbtn.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true">' +
        '<mask id="tt-mask"><rect x="-12" y="-12" width="48" height="48" fill="#fff"/><circle class="tt-cut" cx="18" cy="6" r="7" fill="#000"/></mask>' +
        '<circle class="tt-core" cx="12" cy="12" r="9" fill="currentColor" mask="url(#tt-mask)"/>' +
        '<g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
          '<line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/>' +
          '<line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/>' +
          '<line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/>' +
          '<line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/>' +
        '</g>' +
      '</svg>';
    mastWrap.appendChild(tbtn);
    tbtn.addEventListener("click", function () {
      var next = getTheme() === "dark" ? "light" : "dark";
      if (!document.startViewTransition || reduce) {
        setTheme(next);
        return;
      }
      var r = tbtn.getBoundingClientRect();
      var x = r.left + r.width / 2;
      var y = r.top + r.height / 2;
      var radius = Math.sqrt(Math.pow(Math.max(x, window.innerWidth - x), 2) + Math.pow(Math.max(y, window.innerHeight - y), 2));
      html.style.setProperty("--tx", x + "px");
      html.style.setProperty("--ty", y + "px");
      html.style.setProperty("--tr", radius + "px");
      html.classList.add("theme-vt");
      var done = function () { html.classList.remove("theme-vt"); };
      var vt = document.startViewTransition(function () { setTheme(next); });
      vt.finished.then(done, done);
    });
  }

  /* ================= NAVBAR ================= */
  var here = window.location.pathname.replace(/\/$/, "");
  document.querySelectorAll(".greedy-nav .visible-links a").forEach(function (a) {
    var p = a.pathname.replace(/\/$/, "");
    if (p && here.indexOf(p) === 0) a.classList.add("is-active");
  });

  var nav = document.querySelector(".greedy-nav");
  if (nav) {
    var ind = document.createElement("span");
    ind.className = "nav-indicator";
    nav.appendChild(ind);
    var activeLink = function () {
      return nav.querySelector(".visible-links a.is-active");
    };
    var moveTo = function (a) {
      if (!a || !a.closest(".visible-links")) {
        ind.style.opacity = "0";
        return;
      }
      var n = nav.getBoundingClientRect();
      var r = a.getBoundingClientRect();
      ind.style.width = r.width + "px";
      ind.style.height = r.height + "px";
      ind.style.transform = "translate(" + (r.left - n.left) + "px, " + (r.top - n.top) + "px)";
      ind.style.opacity = "1";
    };
    nav.addEventListener("mouseover", function (e) {
      var a = e.target.closest ? e.target.closest(".visible-links a") : null;
      if (a) moveTo(a);
    });
    nav.addEventListener("mouseleave", function () { moveTo(activeLink()); });
    window.addEventListener("resize", function () { moveTo(activeLink()); });
    window.addEventListener("load", function () { moveTo(activeLink()); });
    setTimeout(function () { moveTo(activeLink()); }, 1300);
    setTimeout(function () { moveTo(activeLink()); }, 2500);
  }

  /* Scroll: floating navbar + hero parallax */
  var masthead = document.querySelector(".masthead");
  var heroWrap = document.querySelector(".page__hero--overlay .wrapper");
  var ticking = false;
  function onScroll() {
    var y = window.pageYOffset;
    if (masthead) masthead.classList.toggle("is-scrolled", y > 10);
    if (heroWrap && !reduce) {
      heroWrap.style.transform = "translateY(" + y * 0.3 + "px)";
      heroWrap.style.opacity = Math.max(0, 1 - y / 500);
    }
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(onScroll);
    }
  }, { passive: true });
  onScroll();

  /* ================= HERO EXTRAS ================= */
  var hero = document.querySelector(".page__hero--overlay");
  var title = hero ? hero.querySelector(".page__title") : null;

  if (hero) {
    /* Animated wave divider */
    var wave = document.createElement("div");
    wave.className = "hero-wave";
    wave.setAttribute("aria-hidden", "true");
    wave.innerHTML =
      '<svg viewBox="0 0 2400 100" preserveAspectRatio="none"><path class="hero-wave__back" d="M0,50 C200,10 400,10 600,50 C800,90 1000,90 1200,50 C1400,10 1600,10 1800,50 C2000,90 2200,90 2400,50 V100 H0 Z"/></svg>' +
      '<svg viewBox="0 0 2400 100" preserveAspectRatio="none"><path class="hero-wave__front" d="M0,68 C200,95 400,95 600,68 C800,40 1000,40 1200,68 C1400,95 1600,95 1800,68 C2000,40 2200,40 2400,68 V100 H0 Z"/></svg>';
    hero.appendChild(wave);
  }

  if (hero && isHome) {
    var hint = document.createElement("a");
    hint.className = "scroll-hint";
    hint.href = "#main";
    hint.setAttribute("aria-label", "Scroll down");
    hint.innerHTML = '<i class="fas fa-chevron-down"></i>';
    hero.appendChild(hint);
  }

  /* ================= CONTEXT SWITCHING DEMO ================= */
  document.querySelectorAll(".cs-demo").forEach(function (demo) {
    var cap = demo.querySelector(".cs-caption");
    var now = demo.querySelector(".cs-now");
    var dots = demo.querySelectorAll(".cs-steps span");
    var steps = [
      { run: "a", pkt: "", irq: false, text: "Process A is running on the CPU." },
      { run: "a", pkt: "", irq: true, text: "Timer interrupt! The OS takes control of the CPU." },
      { run: "os", pkt: "cpu-a", irq: false, text: "The OS saves A's registers (PC, SP, ...) into PCB A." },
      { run: "os", pkt: "b-cpu", irq: false, text: "The OS loads B's saved registers from PCB B." },
      { run: "b", pkt: "", irq: false, text: "Process B continues exactly where it stopped." },
      { run: "b", pkt: "", irq: true, text: "Another timer interrupt..." },
      { run: "os", pkt: "cpu-b", irq: false, text: "B's registers are saved into PCB B." },
      { run: "os", pkt: "a-cpu", irq: false, text: "A's registers are loaded back. A runs again!" }
    ];
    var i = 0;
    function show() {
      var s = steps[i];
      demo.setAttribute("data-run", s.run);
      demo.setAttribute("data-pkt", s.pkt);
      demo.classList.toggle("is-irq", s.irq);
      if (now) now.textContent = s.run === "os" ? "OS" : s.run.toUpperCase();
      if (cap) {
        cap.classList.remove("is-in");
        void cap.offsetWidth;
        cap.textContent = s.text;
        cap.classList.add("is-in");
      }
      dots.forEach(function (d, k) { d.classList.toggle("is-on", k === i); });
      i = (i + 1) % steps.length;
    }
    show();
    setInterval(show, 2300);
  });

  /* Fallback page curtain: finish the reveal */
  if (html.classList.contains("curtain-reveal")) {
    setTimeout(function () { html.classList.remove("curtain-reveal"); }, 900);
  }

  if (reduce) return;

  /* ================= TITLE: letter wave + glitch ================= */
  if (title) {
    var titleText = title.textContent.replace(/\s+/g, " ").trim();
    title.setAttribute("data-text", titleText);

    var glitch = function () {
      if (title.classList.contains("is-glitching")) return;
      title.classList.add("is-glitching");
      setTimeout(function () { title.classList.remove("is-glitching"); }, 680);
    };
    title.addEventListener("mouseenter", glitch);
    if (is404) {
      setTimeout(glitch, 1200);
      setInterval(glitch, 2600);
    }

    if (titleText) {
      var chars = [];
      title.textContent = "";
      title.classList.add("is-split");
      titleText.split(" ").forEach(function (word, wi, arr) {
        var w = document.createElement("span");
        w.className = "tt-word";
        Array.from(word).forEach(function (ch) {
          var c = document.createElement("span");
          c.className = "tt-char";
          c.textContent = ch;
          c.style.animationDelay = (0.15 + chars.length * 0.035).toFixed(3) + "s";
          w.appendChild(c);
          chars.push(c);
        });
        title.appendChild(w);
        if (wi < arr.length - 1) title.appendChild(document.createTextNode(" "));
      });
      var placeGradient = function () {
        var W = title.offsetWidth;
        chars.forEach(function (c) {
          c.style.backgroundSize = W * 2 + "px 100%";
          c.style.backgroundPosition = -c.offsetLeft + "px 0";
        });
      };
      placeGradient();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeGradient);
      setTimeout(function () {
        title.textContent = titleText;
        title.classList.remove("is-split");
        title.classList.add("is-done");
      }, (0.15 + chars.length * 0.035 + 1) * 1000);
    }
  }

  /* ================= TYPEWRITER ================= */
  function prepTyping(el) {
    var text = el.textContent.trim();
    if (!text) return null;
    el.innerHTML = '<span class="tw"><span class="tw-ghost"></span><span class="tw-live"></span></span>';
    el.querySelector(".tw-ghost").textContent = text;
    return { el: el, text: text, live: el.querySelector(".tw-live") };
  }
  function typeOne(item, opts) {
    var i = 0;
    if (opts.caret) item.el.classList.add("tw-typing");
    (function step() {
      i++;
      item.live.textContent = item.text.slice(0, i);
      if (i < item.text.length) {
        setTimeout(step, opts.min + Math.random() * opts.range);
      } else {
        item.el.classList.remove("tw-typing");
      }
    })();
  }
  var lead = document.querySelector(".page__hero--overlay .page__lead");
  if (isHome) {
    var leadItem = lead ? prepTyping(lead) : null;
    if (leadItem) {
      setTimeout(function () {
        typeOne(leadItem, { min: 22, range: 22, caret: true });
      }, 450);
    }
    document.querySelectorAll(".page__hero--overlay .btn").forEach(function (b, k) {
      var btnItem = prepTyping(b);
      if (btnItem) {
        setTimeout(function () {
          typeOne(btnItem, { min: 30, range: 25, caret: false });
        }, 600 + k * 150);
      }
    });
  } else if (lead) {
    var pageItem = prepTyping(lead);
    if (pageItem) {
      setTimeout(function () {
        typeOne(pageItem, { min: 45, range: 55, caret: true });
      }, 800);
    }
  }

  /* ================= PAGE TRANSITION FALLBACK (curtain) ================= */
  if (!supportsVT) {
    document.addEventListener("click", function (e) {
      var a = e.target.closest ? e.target.closest("a") : null;
      if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if ((a.target && a.target !== "_self") || a.hasAttribute("download")) return;
      if (a.origin !== window.location.origin || a.pathname === window.location.pathname) return;
      e.preventDefault();
      try { sessionStorage.setItem("curtain", "1"); } catch (err) {}
      html.classList.add("curtain-cover");
      setTimeout(function () { window.location.href = a.href; }, 450);
    });
    window.addEventListener("pageshow", function () { html.classList.remove("curtain-cover"); });
  }

  /* ================= REVEAL ON SCROLL ================= */
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0, rootMargin: "0px 0px -8% 0px" });
    document.querySelectorAll(".feature__item, .post-card, .sidebar, .page__inner-wrap, .layout--single .page__content > *").forEach(function (el) {
      var i = Array.prototype.indexOf.call(el.parentNode.children, el);
      el.style.setProperty("--d", Math.min(i, 4) * 0.12 + "s");
      el.classList.add("reveal");
      io.observe(el);
    });
  }

  /* ================= POINTER EFFECTS ================= */
  if (fine) {
    /* 3D tilt + light glare on cards */
    document.querySelectorAll(".feature__item .archive__item, .post-card").forEach(function (card) {
      card.addEventListener("mousemove", function (e) {
        var r = card.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width;
        var y = (e.clientY - r.top) / r.height;
        card.style.transform = "perspective(900px) rotateX(" + (0.5 - y) * 10 + "deg) rotateY(" + (x - 0.5) * 10 + "deg) translateY(-8px)";
        card.style.setProperty("--gx", x * 100 + "%");
        card.style.setProperty("--gy", y * 100 + "%");
      });
      card.addEventListener("mouseleave", function () { card.style.transform = ""; });
    });

    /* Magnetic hero buttons */
    document.querySelectorAll(".page__hero--overlay .btn").forEach(function (btn) {
      btn.addEventListener("mousemove", function (e) {
        var r = btn.getBoundingClientRect();
        var dx = e.clientX - (r.left + r.width / 2);
        var dy = e.clientY - (r.top + r.height / 2);
        btn.style.transform = "translate(" + dx * 0.25 + "px, " + dy * 0.35 + "px)";
      });
      btn.addEventListener("mouseleave", function () { btn.style.transform = ""; });
    });

    /* Custom cursor + soft glow */
    var glow = document.querySelector(".cursor-glow");
    var dot = document.querySelector(".cursor-dot");
    var ring = document.querySelector(".cursor-ring");
    html.classList.add("has-cursor");
    var cx = -100, cy = -100, rx = -100, ry = -100, gx = -300, gy = -300;
    window.addEventListener("mousemove", function (e) {
      cx = e.clientX;
      cy = e.clientY;
      html.classList.add("cursor-on");
      if (glow) glow.style.opacity = "1";
    });
    document.addEventListener("mouseout", function (e) {
      if (!e.relatedTarget) html.classList.remove("cursor-on");
    });
    window.addEventListener("mousedown", function () { html.classList.add("cursor-down"); });
    window.addEventListener("mouseup", function () { html.classList.remove("cursor-down"); });
    document.addEventListener("mouseover", function (e) {
      var t = e.target.closest ? e.target.closest("a, button, .btn, input, textarea, select, label, .theme-toggle") : null;
      html.classList.toggle("cursor-hover", !!t);
    });
    (function follow() {
      rx += (cx - rx) * 0.2;
      ry += (cy - ry) * 0.2;
      gx += (cx - gx) * 0.12;
      gy += (cy - gy) * 0.12;
      if (dot) dot.style.transform = "translate3d(" + cx + "px, " + cy + "px, 0)";
      if (ring) ring.style.transform = "translate3d(" + rx + "px, " + ry + "px, 0)";
      if (glow) glow.style.transform = "translate(" + gx + "px, " + gy + "px)";
      window.requestAnimationFrame(follow);
    })();
  }

  /* ================= HERO: particles, depth, shockwave ================= */
  if (!hero) return;
  var canvas = document.createElement("canvas");
  canvas.className = "hero-canvas";
  hero.insertBefore(canvas, hero.firstChild);
  var ctx = canvas.getContext("2d");
  var particles = [];
  var mouse = { x: null, y: null };
  var w = 0, h = 0;
  var tmx = 0, tmy = 0, pmx = 0, pmy = 0;
  var dotColor, lineRGB, mouseRGB;

  function readColors(t) {
    if (t === "light") {
      dotColor = "rgba(91, 33, 182, 0.65)";
      lineRGB = "79, 70, 229";
      mouseRGB = "124, 58, 237";
    } else {
      dotColor = "rgba(196, 181, 253, 0.9)";
      lineRGB = "103, 232, 249";
      mouseRGB = "167, 139, 250";
    }
  }
  readColors(getTheme());
  themeHooks.push(readColors);

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    w = hero.offsetWidth;
    h = hero.offsetHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.min(90, Math.floor((w * h) / 14000));
    particles = [];
    for (var i = 0; i < count; i++) {
      var vx = (Math.random() - 0.5) * 0.6;
      var vy = (Math.random() - 0.5) * 0.6;
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: vx, vy: vy, bvx: vx, bvy: vy,
        r: Math.random() * 1.8 + 0.8
      });
    }
  }

  function draw() {
    pmx += (tmx - pmx) * 0.06;
    pmy += (tmy - pmy) * 0.06;
    hero.style.setProperty("--mx", pmx.toFixed(3));
    hero.style.setProperty("--my", pmy.toFixed(3));
    var ox = pmx * 28, oy = pmy * 22;

    if (window.pageYOffset < h + 200) {
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(ox, oy);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.vx += (p.bvx - p.vx) * 0.03;
        p.vy += (p.bvy - p.vy) * 0.03;
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -40) { p.x = -40; p.vx = Math.abs(p.vx); p.bvx = Math.abs(p.bvx); }
        if (p.x > w + 40) { p.x = w + 40; p.vx = -Math.abs(p.vx); p.bvx = -Math.abs(p.bvx); }
        if (p.y < -40) { p.y = -40; p.vy = Math.abs(p.vy); p.bvy = Math.abs(p.bvy); }
        if (p.y > h + 40) { p.y = h + 40; p.vy = -Math.abs(p.vy); p.bvy = -Math.abs(p.bvy); }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = dotColor;
        ctx.fill();

        for (var j = i + 1; j < particles.length; j++) {
          var q = particles[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 130) {
            ctx.strokeStyle = "rgba(" + lineRGB + ", " + (1 - d / 130) * 0.35 + ")";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }

        if (mouse.x !== null) {
          var mxp = mouse.x - ox, myp = mouse.y - oy;
          var mx = p.x - mxp, my = p.y - myp;
          var md = Math.sqrt(mx * mx + my * my);
          if (md < 180) {
            ctx.strokeStyle = "rgba(" + mouseRGB + ", " + (1 - md / 180) * 0.7 + ")";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mxp, myp);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }
    window.requestAnimationFrame(draw);
  }

  hero.addEventListener("mousemove", function (e) {
    var rect = hero.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    tmx = (mouse.x / rect.width) * 2 - 1;
    tmy = (mouse.y / rect.height) * 2 - 1;
  });
  hero.addEventListener("mouseleave", function () {
    mouse.x = null;
    mouse.y = null;
    tmx = 0;
    tmy = 0;
  });

  /* Click: shockwave that pushes the particles away */
  hero.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("a, button")) return;
    var rect = hero.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    ["click-ring", "click-ring click-ring--2"].forEach(function (cls) {
      var ringEl = document.createElement("span");
      ringEl.className = cls;
      ringEl.style.left = x + "px";
      ringEl.style.top = y + "px";
      hero.appendChild(ringEl);
      setTimeout(function () { ringEl.remove(); }, 1200);
    });
    var ox = pmx * 28, oy = pmy * 22;
    particles.forEach(function (p) {
      var dx = p.x + ox - x, dy = p.y + oy - y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < 280) {
        var force = (1 - d / 280) * 9;
        p.vx += (dx / d) * force;
        p.vy += (dy / d) * force;
      }
    });
  });

  window.addEventListener("resize", resize);
  window.addEventListener("load", resize);

  resize();
  draw();
})();
</script>
