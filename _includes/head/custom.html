<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var d = document.documentElement;
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    d.setAttribute("data-theme", t === "light" ? "light" : "dark");
    try {
      if (sessionStorage.getItem("curtain") === "1") {
        sessionStorage.removeItem("curtain");
        d.classList.add("curtain-reveal");
      }
    } catch (e) {}
    window.addEventListener("pagereveal", function (e) {
      if (e.viewTransition) d.classList.add("vt-arrived");
    });
  })();
</script>
